# Builds the site on every push (including Pages CMS saves) and pull request.
# This workflow only BUILDS and CHECKS — it does not deploy anywhere.
# See docs/DEPLOYMENT.md for connecting a host.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      # Builds dist/ and runs scripts/verify-dist.mjs (draft exclusion, links, metadata).
      - run: npm run build

      - name: Keep the built site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 14

      - name: Summary
        run: |
          echo "### Build passed" >> "$GITHUB_STEP_SUMMARY"
          echo "The site built and passed its checks. **Nothing was deployed** — this workflow has no hosting connected (see docs/DEPLOYMENT.md)." >> "$GITHUB_STEP_SUMMARY"
